<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<title>Offline · PawFlow</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: #f5f8ff; color: #1c2433;
  }
  main { width: 100%; max-width: 22rem; text-align: center; }
  img { width: 64px; height: 64px; }
  h1 { margin: 16px 0 6px; font-size: 18px; letter-spacing: -0.02em; }
  p { margin: 0; font-size: 14px; line-height: 1.5; color: #5b6578; }
  button {
    margin-top: 20px; height: 44px; padding: 0 20px; border: 0; border-radius: 10px;
    background: #2563eb; color: #fff; font: inherit; font-size: 14px; font-weight: 600;
  }
  button:focus-visible { outline: 3px solid #93b4f5; outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="" width="64" height="64">
  <h1>Tidak ada koneksi internet</h1>
  <p>Data PawFlow disimpan di server, jadi perlu internet untuk dibuka. Coba lagi setelah tersambung.</p>
  <button type="button" onclick="location.reload()">Coba lagi</button>
</main>
</body>
</html>
